name: Security & Secret Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * 0' # Weekly Sunday audit
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks Secret Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run Gitleaks detection
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  npm-audit:
    name: NPM Dependency Vulnerability Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies for high/critical vulnerabilities
        # npm audit --json + explicit gate (npm 10/11 --ignore semantics differ).
        # WAIVED: picomatch GHSA-fc5q-39xc-vjpf (ReDoS, high) - upstream has NO
        # patched release ("picomatch *" vulnerable, "no fix available"); only
        # consumer is lint-staged, a devDependency pre-commit runner that never
        # ships. Remove from WAIVED when picomatch publishes a patched version.
        run: |
          npm audit --json > npm-audit.json || true
          node -e "
            const a = JSON.parse(require('fs').readFileSync('npm-audit.json', 'utf8'));
            const WAIVED = new Set(['picomatch']);
            const bad = Object.values(a.vulnerabilities || {})
              .filter((v) => !WAIVED.has(v.name) && (v.severity === 'high' || v.severity === 'critical'));
            if (bad.length) {
              for (const v of bad) console.error('HIGH/CRITICAL:', v.name, v.severity, (v.via || []).map(String).join(','));
              process.exit(1);
            }
            console.log('npm audit gate: clean (waived: picomatch GHSA-fc5q-39xc-vjpf, no upstream fix)');
          "
