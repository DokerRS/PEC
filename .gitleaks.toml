[[rules]]
id = "pec-env-code-sign-master-key"
description = "PEC CODE_SIGN_MASTER_KEY assignment"
regex = '''CODE_SIGN_MASTER_KEY[ \t]*=[ \t]*["']?([A-Za-z0-9_/.+-]{19,})'''
secretGroup = 1
keywords = ["code_sign_master_key"]
tags = ["pec", "secret"]

[allowlist]
description = "PEC test fixtures, env template, documentation placeholders, and RSA public keys"
paths = [
  '''(^|/)\.env\.example$''',
  '''(^|/)test/.*''',
  '''(^|/)docs/.*''',
  '''(^|/)\.agents/.*''',
  '''(^|/)README(\.ru)?\.md$''',
  # Vendored third-party source (Dear ImGui, MIT) - upstream code, no PEC secrets
  '''(^|/)client/Windows/gui/imgui/.*''',
]
# RSA SPKI (2048) public-key DER prefix in base64: public keys are not secrets.
# Covers the CRX manifest "key" line that pins the Chrome extension ID for GPO
# forcelists (extension/manifest.json, shipped to every browser by design).
# corp-proxy-secret-token-change-me: documented canary placeholder (NAT-2),
# intentionally committed in code/docs as a non-secret sentinel.
# process.env.* references captured by the PEC assignment rules are reads,
# not literal secrets.
regexes = [
  '''MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ''',
  '''corp-proxy-secret-token-change-me''',
  '''process\.env\.[A-Za-z0-9_]+''',
]
