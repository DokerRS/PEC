services:
  pec-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: pec-proxy-extension-corp:latest
    container_name: pec-proxy-server
    restart: unless-stopped
    ports:
      - "${HOST:-0.0.0.0}:${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - EXT_SHARED_TOKEN=${EXT_SHARED_TOKEN:?Set EXT_SHARED_TOKEN in .env (see .env.example)}
      - ADMIN_TOKEN=${ADMIN_TOKEN:?Set ADMIN_TOKEN in .env (a long random value, distinct from EXT_SHARED_TOKEN)}
      # Docker secrets mode: replace the direct token lines above with file
      # references (read natively by loadEnv.ts loadDockerSecrets, e.g. via
      # `secrets:` + /run/secrets/... mounts):
      #   - ADMIN_TOKEN_FILE=/run/secrets/admin_token
      #   - EXT_SHARED_TOKEN_FILE=/run/secrets/ext_shared_token
      #   - ADMIN_PASSWORD_FILE=/run/secrets/admin_password
      #   - PAC_SIGNING_SECRET_FILE=/run/secrets/pac_signing_secret
      #   - CODE_SIGN_MASTER_KEY_FILE=/run/secrets/code_sign_master_key
      # All persistent state lives in /app/data (mounted volume below) so
      # profiles, rotation config and instance metadata survive redeploys.
      - DATA_DIR=/app/data
      - PROXIES_STORE_PATH=/app/data/proxies.json
      - CREDS_STORE=/app/data/current_creds.json
      - DASHBOARD_AUTH_PATH=/app/data/dashboard_auth.json
      - PROXY_CONFIG_PATH=/app/data/proxy_config.json
      - ROUTING_PROFILES_PATH=/app/data/routing_profiles.json
      - ROUTING_PRESETS_PATH=/app/data/routing_presets.json
      - INSTANCES_META_PATH=/app/data/instances_meta.json
      - ROTATION_CONFIG_PATH=/app/data/rotation_config.json
      - ROTATION_HISTORY_PATH=/app/data/rotation_history.json
      - BUILDER_CONFIG=/app/data/extension_build_config.json
      # Behind the compose-provided nginx (docker-compose.prod.yml) set to 1;
      # for this direct-exposure setup keep disabled unless another proxy sits
      # in front. Enables correct client IPs for rate limiting and audit.
      - TRUST_PROXY=${TRUST_PROXY:-false}
      # Public URL used in updates.xml / GPO artifacts (prevents Host-header
      # poisoning). Set it to the URL your fleet uses to reach this server.
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-}
      # Legacy Remnawave API-login fallback for single-panel rotation. New
      # dashboard panel entries store their API token in the persistent data volume.
      # This flag relaxes SSRF checks for private endpoints; keep false unless required.
      - ALLOW_INTERNAL_PANEL=${ALLOW_INTERNAL_PANEL:-false}
      - REMNAWAVE_PANEL_URL=${REMNAWAVE_PANEL_URL:-}
      - REMNAWAVE_ADMIN_USER=${REMNAWAVE_ADMIN_USER:-}
      - REMNAWAVE_ADMIN_PASS=${REMNAWAVE_ADMIN_PASS:-}
      - REMNAWAVE_TARGET_USERNAME=${REMNAWAVE_TARGET_USERNAME:-pec-user}
      - REMNAWAVE_INSECURE_SKIP_VERIFY=${REMNAWAVE_INSECURE_SKIP_VERIFY:-false}
      # Legacy 3x-ui names kept as fallback for existing deployments.
      - XUI_PANEL_URL=${XUI_PANEL_URL:-}
      - XUI_ADMIN_USER=${XUI_ADMIN_USER:-}
      - XUI_ADMIN_PASS=${XUI_ADMIN_PASS:-}
      - XUI_INBOUND_REMARK=${XUI_INBOUND_REMARK:-}
      - ROTATION_INTERVAL_MIN=${ROTATION_INTERVAL_MIN:-1440}
      - PAC_SIGNING_SECRET=${PAC_SIGNING_SECRET:-}
      - PAC_REQUIRE_SIGNATURE=${PAC_REQUIRE_SIGNATURE:-false}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - PEC_RELEASES_DIR=/app/dist/releases
    volumes:
      # Runtime state: survives rebuilds (creds, profiles, rotation, meta).
      - pec_data:/app/data
      # The CRX signing key lives here - a stable key means a stable
      # extension ID (GPO forcelists break when the ID changes).
      - pec_extension:/app/extension
      - pec_updates:/app/dist/updates
      - pec_releases:/app/dist/releases
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  pec_data:
    driver: local
  pec_extension:
    driver: local
  pec_updates:
    driver: local
  pec_releases:
    driver: local
